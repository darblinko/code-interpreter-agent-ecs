line-length = 100
target-version = "py311"
extend-exclude = ["src", "infra", "scripts"]

[lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[lint.isort]
known-first-party = ["service", "code_interpreter_agent"]

[lint.per-file-ignores]
"tests/test_infra.py" = ["E501"]
"tests/test_scripts.py" = ["E501"]
